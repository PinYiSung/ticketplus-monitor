name: TicketPlus 釋票偵測

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticketplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 查詢票券並通知（單次觸發後持續查最多 110 分鐘，每 60 秒一次）
        env:
          TP_TG_BOT_TOKEN: ${{ secrets.TP_TG_BOT_TOKEN }}
          TP_TG_CHAT_ID: ${{ secrets.TP_TG_CHAT_ID }}
        run: timeout 6600 python3 monitor.py --interval 60 || true
