name: TicketPlus 釋票偵測

on:
  schedule:
    # GitHub 自己的排程不準時，這裡只當備援，主要觸發改由外部 cron 服務呼叫 workflow_dispatch
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticketplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 查詢票券並通知
        env:
          TP_TG_BOT_TOKEN: ${{ secrets.TP_TG_BOT_TOKEN }}
          TP_TG_CHAT_ID: ${{ secrets.TP_TG_CHAT_ID }}
        run: python3 monitor.py --once
